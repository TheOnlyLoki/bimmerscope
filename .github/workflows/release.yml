name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: bmwa
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: bmwa.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: bmwa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p bmwa --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=bimmerscope-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} README.md LICENSE "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            bimmerscope-*.tar.gz
            bimmerscope-*.zip
